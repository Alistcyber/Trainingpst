<title>Se cayó algo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: tres secciones con tarjetas que se voltean. Cada tarjeta lleva el color de su contenido. */
:root{
  --bg:#F3F5F9; --fg:#14213A; --muted:#51607A; --surface:#FFFFFF; --line:#D9DFEA;
  --net:#1D5FC4; --net-soft:#E4EDFB;
  --pow:#9A6200; --pow-soft:#FBF0D6;
  --tool:#5B3FC4; --tool-soft:#ECE8FA;
  --dev:#B3261E; --dev-soft:#FBE7E5;
  --ok:#217A3A; --ok-soft:#E1F3E6;
  --no:#B3261E; --no-soft:#FBE7E5;
  --navy:#16263F; --on-navy:#FFFFFF;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --fg:#E8EDF6; --muted:#9CA9C0; --surface:#172238; --line:#2A3853;
  --net:#7FB0FF; --net-soft:#16294A; --pow:#F2B84B; --pow-soft:#3A2D10;
  --tool:#B7A4FF; --tool-soft:#2A2250; --dev:#FF8F86; --dev-soft:#3E1B19;
  --ok:#6FD08A; --ok-soft:#12301D; --no:#FF8F86; --no-soft:#3E1B19;
  --navy:#0A1220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --fg:#E8EDF6; --muted:#9CA9C0; --surface:#172238; --line:#2A3853;
  --net:#7FB0FF; --net-soft:#16294A; --pow:#F2B84B; --pow-soft:#3A2D10;
  --tool:#B7A4FF; --tool-soft:#2A2250; --dev:#FF8F86; --dev-soft:#3E1B19;
  --ok:#6FD08A; --ok-soft:#12301D; --no:#FF8F86; --no-soft:#3E1B19;
  --navy:#0A1220; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
header{background:var(--navy);color:var(--on-navy);margin-inline:calc(50% - 50vw);padding:36px max(16px,calc(50vw - 520px)) 32px}
header h1{font:800 clamp(30px,6vw,46px)/1.05 var(--display);margin:0 0 8px;text-wrap:balance}
header p{margin:0;color:#C9D4E8;max-width:60ch}
h2{font:800 clamp(22px,4vw,28px)/1.15 var(--display);margin:44px 0 6px;text-wrap:balance}
.lead{margin:0 0 20px;color:var(--muted);max-width:62ch}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{perspective:1100px;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:grid;width:100%;align-items:stretch}
.card:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:16px}
.inner{display:grid;height:100%;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:10px}
.front{background:var(--c-soft);border:2px solid var(--c)}
.back{background:var(--surface);border:2px solid var(--c);transform:rotateY(180deg)}
.tag{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.face h3{font:800 22px/1.15 var(--display);margin:0;text-wrap:balance}
.front h3{font-size:26px}
.front .sub{color:var(--fg);margin:0}
.flip{margin-top:auto;font-size:13px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:6px;padding-top:10px}
.flip::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--c);display:inline-block;background:
  linear-gradient(var(--c),var(--c)) center/8px 2px no-repeat,linear-gradient(var(--c),var(--c)) center/2px 8px no-repeat}
.back ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.back li::marker{color:var(--c);font-weight:700}
.back .warn{margin:auto 0 0;font-size:14px;background:var(--c-soft);border-radius:10px;padding:8px 10px}
.net{--c:var(--net);--c-soft:var(--net-soft)}
.pow{--c:var(--pow);--c-soft:var(--pow-soft)}
.tool{--c:var(--tool);--c-soft:var(--tool-soft)}
.dev{--c:var(--dev);--c-soft:var(--dev-soft)}
.yes{--c:var(--ok);--c-soft:var(--ok-soft)}
.nope{--c:var(--no);--c-soft:var(--no-soft)}
.verdict{font:800 26px/1 var(--display);color:var(--c)}
.rule{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:18px 20px;margin-top:20px;max-width:none}
.rule strong{font-family:var(--display)}
.who .front{background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
main>h2:first-child{margin-top:8px}
</style>

<main class="wrap">
<h2>Se cayó algo: qué hago</h2>
<p class="lead">La operación está en la nube, así que casi siempre puedes seguir trabajando desde otro lugar. Lo importante es avisar con la hora de inicio.</p>
<div class="grid" id="s4"></div>


</main>
<script>
var g4=document.getElementById("s4"),g5=document.getElementById("s5"),g6=document.getElementById("s6");
var S4=[
 {k:"net",tag:"Conexión",t:"Se cayó mi internet",sub:"No puedo conectarme desde donde estoy.",
  steps:["Activa los datos del celular y compártelos al computador.","Si no alcanza, muévete a un coworking u otro sitio con conexión.","Avisa a tu líder por el grupo oficial de WhatsApp, con la hora en que empezó.","Si dura más de [X] horas, tu líder lo escala al Director de operaciones."]},
 {k:"pow",tag:"Energía",t:"Se fue la luz",sub:"El equipo se apaga o no puedo trabajar.",
  steps:["Guarda y cierra lo que tengas. Lo importante ya está en la nube.","Pasa a otro lugar con energía, o trabaja desde el celular si es urgente.","Avisa a tu líder si no vas a poder trabajar, con la hora de inicio."],
  warn:"No necesitas la oficina para retomar el trabajo."},
 {k:"tool",tag:"Herramientas",t:"Se cayó Teams, el correo o el CRM",sub:"Una herramienta principal no responde.",
  steps:["Pregunta a un compañero si a él también le falla.","Si es general, usa el grupo oficial de WhatsApp como respaldo.","Reporta a tu líder y al Director de operaciones con los 5 datos.","El Director de operaciones abre el caso con el proveedor, según el SLA."],
  warn:"Los 5 datos: qué pasó, desde cuándo, qué se afecta, impacto en clientes, qué ya se hizo."},
 {k:"dev",tag:"Equipos",t:"Perdí o me robaron un equipo o celular",sub:"Tenía acceso a cuentas de la empresa.",
  steps:["Avisa de inmediato a tu líder y a Seguridad Digital.","No esperes a ver si aparece: hay que bloquear el acceso.","Cambia tus contraseñas desde otro dispositivo.","Anota cuándo y dónde lo viste por última vez."],
  warn:"Es nivel Alto: se atiende hoy mismo."}
];
var S5=[
 {ok:true,t:"Pedirle que explique un mensaje de error",why:"Sirve, siempre que quites nombres, direcciones y claves del mensaje antes de pegarlo."},
 {ok:false,t:"Pegar un correo de un cliente para que lo resuma",why:"Los correos y datos de clientes no salen de la empresa. Resume tú, o pega solo un texto de ejemplo sin datos reales."},
 {ok:true,t:"Pedirle ayuda para redactar un texto general",why:"Sirve para ideas de redacción, siempre sin nombres de clientes, cifras reales ni detalles de proyectos."},
 {ok:false,t:"Pegar código o un archivo de configuración con llaves o contraseñas",why:"Las credenciales y llaves nunca se pegan. Si ya pasó, cámbialas y avisa."}
];
var S6=[
 {t:"Quiero avisarle al cliente",steps:["Lo hace solo el líder o el gerente de proyecto.","Primero con aprobación previa.","Solo con hechos confirmados, sin suposiciones.","No esperes a que el cliente pregunte."]},
 {t:"Me escribe un medio o alguien externo",steps:["No respondas ni confirmes nada.","Pásalo de inmediato a tu líder.","Solo el portavoz oficial habla: Director General o Director de operaciones."]},
 {t:"Quiero avisar a mis compañeros",steps:["Usa los canales oficiales: grupos de WhatsApp de la empresa, Teams o correo corporativo.","Cuenta solo lo confirmado.","Deja los detalles para tu líder y Seguridad Digital."]}
];
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function card(cls,front,back,label){
  var b=el("button","card "+cls);b.type="button";b.setAttribute("aria-pressed","false");b.setAttribute("aria-label",label);
  var i=el("div","inner");i.appendChild(el("div","face front",front));i.appendChild(el("div","face back",back));b.appendChild(i);
  b.addEventListener("click",function(){b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")==="true"?"false":"true")});
  return b}
if(g4)S4.forEach(function(c){
  var back='<span class="tag">'+c.t+'</span><h3>Qué hacer</h3><ol>'+c.steps.map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+"</ol>"+(c.warn?'<p class="warn">'+esc(c.warn)+"</p>":"")+'<span class="flip">Volver</span>';
  g4.appendChild(card(c.k,'<span class="tag">'+c.tag+'</span><h3>'+c.t+'</h3><p class="sub">'+c.sub+'</p><span class="flip">Ver los pasos</span>',back,c.t));
});
if(g5)S5.forEach(function(c){
  var back='<span class="verdict">'+(c.ok?"Sí, con cuidado":"No")+'</span><p style="margin:0">'+esc(c.why)+'</p><span class="flip">Volver</span>';
  var b=card("tool",'<span class="tag">¿Se puede?</span><h3>'+c.t+'</h3><span class="flip">Ver respuesta</span>',back,c.t);
  var bk=b.querySelector(".back");
  bk.style.setProperty("--c",c.ok?"var(--ok)":"var(--no)");bk.style.setProperty("--c-soft",c.ok?"var(--ok-soft)":"var(--no-soft)");
  g5.appendChild(b);
});
if(g6)S6.forEach(function(c){
  var back='<span class="tag">'+c.t+'</span><ol>'+c.steps.map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+'</ol><span class="flip">Volver</span>';
  g6.appendChild(card("net",'<span class="tag">Comunicación</span><h3>'+c.t+'</h3><span class="flip">Ver qué hacer</span>',back,c.t));
});
</script>
